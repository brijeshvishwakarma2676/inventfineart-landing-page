<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0e0d0c" />
    <link rel="canonical" href="https://www.inventfineart.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.inventfineart.com/" />
    <meta property="og:title" content="Invent Fine Art | Sculptures, Wall Murals, GRC Facades &amp; Water Fountains – Mumbai" />
    <meta property="og:description" content="ISO 9001:2008 certified maker &amp; installer of bespoke sculptures, wall murals, GRC facades &amp; fountains in Mumbai since 2009." />
    <meta property="og:image" content="https://www.inventfineart.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Invent Fine Art | Sculptures, Wall Murals, GRC Facades &amp; Water Fountains – Mumbai" />
    <meta name="twitter:description" content="ISO 9001:2008 certified maker &amp; installer of bespoke sculptures, wall murals, GRC facades &amp; fountains in Mumbai since 2009." />
    <meta name="twitter:image" content="https://www.inventfineart.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts are self-hosted (see src/styles/base.css) -->

    <!-- Home only: preload the first hero image and paint it from static markup so LCP does not wait
         for the JS bundle. React replaces the contents of #root when it mounts. -->
    <script>
      if (location.pathname === '/') {
        var set = '/assets/hero/banner-1-960.webp 960w, /assets/hero/banner-1.webp 1920w';
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/webp';
        l.setAttribute('imagesrcset', set);
        l.setAttribute('imagesizes', '100vw');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
        document.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div aria-hidden="true" style="position:relative;min-height:88vh;overflow:hidden;background:#0e0d0c">' +
            '<img src="/assets/hero/banner-1.webp" srcset="' + set + '" sizes="100vw" alt="" fetchpriority="high" ' +
            'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%">' +
            '<div style="position:absolute;inset:0;background:linear-gradient(to top,#0e0d0c,rgba(14,13,12,.6),transparent)"></div>' +
            '<div style="position:absolute;inset:0;background:rgba(91,48,0,.35);mix-blend-mode:multiply"></div></div>';
        });
      }
    </script>
    <style>
      /* Shown before the app code arrives (slow connections): no white flash, a quiet brand loader */
      html, body { margin: 0; background: #0e0d0c; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #a89f93; font: 600 11px/1 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
      #boot img { width: 48px; height: 48px; object-fit: contain; border-radius: 2px; }
      #boot i { display: block; position: relative; width: 120px; height: 2px; background: #2a2622; overflow: hidden; }
      #boot i::after { content: ''; position: absolute; inset: 0; background: #b93a25; transform: translateX(-100%); animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status">
        <img src="/favicon.png" alt="" width="48" height="48" />
        <span>Invent Fine Art</span>
        <i></i>
      </div>
    </div>
    <noscript>
      <p style="position:relative;z-index:1;max-width:560px;margin:0 auto;padding:96px 24px;color:#f1ebe2;font:16px/1.6 system-ui,sans-serif">
        Invent Fine Art — sculptures, wall murals, water fountains, GRC facades and planters. Please enable JavaScript to view
        this website, or contact us on +91 93232 10327 or inventfineart.mum@gmail.com. Head office: Kandivali East, Mumbai.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
